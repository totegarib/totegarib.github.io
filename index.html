<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis Lukas</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mis Lukas">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#26202D" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<script>window.MISLUKAS_PWA = true;</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300..700&display=swap">
<style>
/* Mis Lukas · neutros fijos; los colores de la paleta los pone el script (Ajustes → Apariencia) */
:root{
  --ground:#F7F4EC; --phone:#FFFFFF; --ink:#2A2230; --muted:#6F6776; --line:#E6E0D6;
  --accent:#6B5882; --accent-soft:#ECE7F2; --on-accent:#FFFFFF;
  --tc0:#6B5882; --on-tc0:#FFFFFF; --tc1:#F4D9A6; --on-tc1:#4A3312; --dot1:#D4860B;
  --gold:#E8A700; --gold-soft:#F4DC6B; --sun-soft:#FCF6E0; --sun-line:#F1E2A8;
  --ok:#5E7A1F; --warn:#9A6400; --warn-soft:#FBF0CF; --bad:#B23A1E; --bad-soft:#F8E3DC;
  --tile:#F3EEE3; --st-ok:#E4EDCF; --st-w:#FBE9B8; --st-b:#F7D6CC;
  --font:"Albert Sans","Helvetica Neue",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#1C1722; --phone:#26202D; --ink:#F3EEE4; --muted:#ABA2B3; --line:#3A3242;
  --ok:#B3CC62; --warn:#F2C54D; --warn-soft:#3B3118; --bad:#F08A6C; --bad-soft:#3E231D;
  --tile:#352D3E; --st-ok:#34401F; --st-w:#4A3A12; --st-b:#4C2720; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#1C1722; --phone:#26202D; --ink:#F3EEE4; --muted:#ABA2B3; --line:#3A3242;
  --ok:#B3CC62; --warn:#F2C54D; --warn-soft:#3B3118; --bad:#F08A6C; --bad-soft:#3E231D;
  --tile:#352D3E; --st-ok:#34401F; --st-w:#4A3A12; --st-b:#4C2720; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--phone);color:var(--ink);font-family:var(--font);font-weight:300;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
b,strong{font-weight:600}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:var(--ink);background:var(--ground);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
input[type=color]{padding:2px;height:42px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.num{font-variant-numeric:tabular-nums}
.in{color:var(--ok)!important}
.nx{color:var(--muted)!important;font-weight:400!important}
.out{color:var(--bad)!important}
.muted{color:var(--muted);font-size:13px}

#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header.topbar{position:sticky;top:0;z-index:5;background:var(--phone);display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 10px}
header.topbar h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;min-width:0}
header.topbar .back{font-size:26px;line-height:1;color:var(--accent);font-weight:400;padding-right:4px}
.hicons{display:flex;gap:6px;flex:none}
.icbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--ground);font-size:17px;position:relative}
.icbtn .badge{top:-2px;left:auto;right:-2px}
main{flex:1;padding:0 16px 110px;display:grid;gap:14px;align-content:start}
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--phone);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:8px 6px calc(env(safe-area-inset-bottom,0px) + 8px);max-width:560px;margin:0 auto}
nav.tabbar button{display:grid;justify-items:center;gap:2px;font-size:10.5px;color:var(--muted);position:relative}
nav.tabbar button .i{font-size:19px;line-height:1.2;filter:grayscale(1);opacity:.65}
nav.tabbar button.a{color:var(--accent);font-weight:600}
nav.tabbar button.a .i{filter:none;opacity:1}
.badge{position:absolute;top:-3px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:10px;font-weight:600;border-radius:99px;padding:0 5px;min-width:16px;text-align:center;line-height:16px}

.sect{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:4px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--ground);border-radius:12px;padding:3px;font-size:13px;text-align:center}
.seg button{padding:7px 2px;border-radius:9px;color:var(--muted)}
.seg button.on{background:var(--phone);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.hero{background:var(--sun-soft);border:1px solid var(--sun-line);border-radius:20px;padding:14px;display:grid;gap:6px}
.big{font-size:36px;font-weight:600;line-height:1;letter-spacing:-.02em}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.hero .bar{background:var(--sun-line)}
.bar i{display:block;height:100%;background:var(--gold)}
.bar i.pend{background:var(--gold-soft)}
.flow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.flow div{display:grid;gap:1px}
.flow b{font-size:18px}
.flow span{color:var(--muted);font-size:12px}
.capsula{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--accent-soft);border-radius:14px;padding:6px 8px;font-size:17px;font-weight:600;text-transform:capitalize;color:var(--ink)}
.capsula button{width:32px;height:32px;border-radius:50%;background:var(--phone);color:var(--accent);font-size:20px;line-height:1;display:grid;place-items:center;flex:none}
.capsula button:disabled{color:var(--line);background:transparent;cursor:default}
.wm{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1;white-space:nowrap}
.wm .a{color:var(--accent)} .wm .b{color:var(--dot1)}
.logo{width:30px;height:30px;border-radius:8px;flex:none;display:block}
.mesnav{display:flex;align-items:center;gap:4px;font-size:20px;font-weight:600;text-transform:capitalize}
.mesnav button{width:32px;height:32px;border-radius:50%;font-size:22px;line-height:1;color:var(--accent);display:grid;place-items:center}
.mesnav button:disabled{color:var(--line);cursor:default}
.mesnav span{min-width:0}
.restot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.restot b{color:var(--ink)}
.tc{border-radius:16px;padding:12px;display:grid;gap:10px;text-align:left;width:100%}
.tc.c0{background:var(--tc0);color:var(--on-tc0)} .tc.c1{background:var(--tc1);color:var(--on-tc1)} .tc.cx{background:var(--ground);color:var(--ink);border:1px solid var(--line)}
.tc .nm{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:600}
.tc .nm span:last-child{font-weight:400;opacity:.85}
.tc .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tc .two div{display:grid;gap:1px;min-width:0}
.tc small{font-size:11px;opacity:.85}
.tc b{font-size:19px;font-weight:600;letter-spacing:-.01em}
.tc .sep{border-left:1px solid rgba(127,127,127,.45);padding-left:10px}
.alerta{display:flex;gap:10px;align-items:center;background:var(--accent-soft);border-radius:14px;padding:11px 12px;font-size:14px;width:100%;text-align:left}
.alerta.w{background:var(--warn-soft)} .alerta.b{background:var(--bad-soft)}
.alerta .go{margin-left:auto;font-weight:600;color:var(--accent);white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.md{display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.stat2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:2px}
.stat b{font-size:18px;font-weight:600}
.stat span{font-size:12px;color:var(--muted)}
.lnk{color:var(--accent);font-weight:600;font-size:14px;justify-self:start}
.card{border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:8px}
.card.due{background:var(--accent-soft);border-color:transparent}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:4px 0}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{text-align:right;overflow-wrap:anywhere}
.kvd .kv{border-bottom:1px dashed var(--line);padding:5px 0}
.pill{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600;white-space:nowrap}
.pill.w{background:var(--warn-soft);color:var(--warn)}
.timeline{position:relative;height:8px;border-radius:99px;background:var(--line)}
.timeline i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:99px}
.tl-l{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}

.list{display:grid}
.day{font-size:12px;color:var(--muted);padding:12px 0 4px;font-weight:600;text-transform:capitalize}
.tx{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px;background:var(--tile);font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;flex:none}
.ico.ok{background:var(--st-ok)} .ico.w{background:var(--st-w)} .ico.b{background:var(--st-b)}
.ico.sm{width:30px;height:30px;font-size:16px;border-radius:8px}
.tx .name{font-weight:500;font-size:14px;overflow-wrap:anywhere}
.tx .meta{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.amt{font-weight:600;font-size:14px;text-align:right;white-space:nowrap}
.amt small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.tag{font-size:10px;border-radius:6px;padding:0 5px;border:1px solid var(--line);color:var(--muted);font-weight:500;letter-spacing:.02em}
.tag.auto,.tag.shr{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tag.rev{background:var(--warn-soft);color:var(--warn);border-color:transparent}

.rv{border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:10px}
.rv.q{border-color:var(--gold);background:var(--warn-soft)}
.rv .h{display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.rv .name{font-weight:500;font-size:15px;overflow-wrap:anywhere}
.rv .meta{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hint{font-size:13px;color:var(--warn);font-weight:500}
.act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pick{display:inline-flex;gap:6px;align-items:center;font-size:14px;border:1px dashed var(--muted);border-radius:99px;padding:6px 12px;font-weight:500}
.pick::after{content:"▾";font-size:10px;color:var(--muted)}
.btn{font-size:14px;font-weight:600;border-radius:99px;padding:7px 14px;border:1px solid var(--line)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.del{color:var(--bad);border-color:var(--bad-soft)}
.btn.full{width:100%;padding:11px;text-align:center}
.ok-btn{margin-left:auto;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font-size:18px;font-weight:600;flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:13px;border:1px solid var(--line);border-radius:99px;padding:6px 11px;display:inline-flex;gap:5px;align-items:center}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.fchip{font-size:12px;border-radius:99px;padding:4px 10px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.extracto{font-size:12px;color:var(--muted);background:var(--ground);border-radius:10px;padding:8px;max-height:90px;overflow:auto}
.montoin{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.montoin input{max-width:170px}
.search{display:grid;grid-template-columns:1fr auto auto;gap:8px}
.mas{width:42px;border-radius:12px;font-size:24px;line-height:1;font-weight:400;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.fbtn{border-radius:12px;padding:9px 13px;font-size:14px;font-weight:600;background:var(--accent);color:var(--on-accent)}

.bud{display:grid;gap:14px}
.brow{display:grid;grid-template-columns:1fr auto;gap:5px 10px;font-size:14px;align-items:center;text-align:left;width:100%}
.brow .bar{grid-column:1/-1;height:7px}
.brow .lim{font-size:12px;color:var(--muted);text-align:right}
.brow.ok .bar i{background:var(--ok)} .brow.w .bar i{background:var(--gold)} .brow.b .bar i{background:var(--bad)}
.brow.w .v{color:var(--warn)} .brow.b .v{color:var(--bad)}
.bl{display:flex;gap:8px;align-items:center;min-width:0}
.v{font-weight:600}

.dsum{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dsum div{border-radius:14px;padding:10px 12px;display:grid;gap:2px}
.dsum .me{background:var(--st-ok)} .dsum .yo{background:var(--st-b)}
.dsum small{font-size:12px;color:var(--muted)}
.dsum b{font-size:20px;font-weight:600}
.debt{display:grid;grid-template-columns:36px 1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.debt .name{font-weight:500;font-size:14px}
.debt .meta{font-size:12px;color:var(--muted)}
.debt .bar{grid-column:2/4;height:5px}
.debt .bar i{background:var(--ok)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;background:var(--accent-soft);color:var(--accent)}

.grupo{border:1px solid var(--line);border-radius:14px;padding:2px 12px}
.fila{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;width:100%;text-align:left}
.fila:last-child{border-bottom:0}
.fila small{grid-column:2;font-size:12px;color:var(--muted)}
.fila .v{grid-row:1/3;grid-column:3;font-size:13px;color:var(--accent);font-weight:600}
.tog{width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;grid-row:1/3;grid-column:3;transition:background .15s}
.tog::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--phone);transition:left .15s}
.tog.on{background:var(--accent)} .tog.on::after{left:21px}
.pals{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pal{border:1px solid var(--line);border-radius:12px;padding:8px;display:grid;gap:6px;font-size:13px;text-align:left}
.pal.on{border:2px solid var(--accent);padding:7px;font-weight:600}
.sws{display:flex;height:18px;border-radius:5px;overflow:hidden}
.sws i{flex:1}

.lc{width:100%;height:auto;display:block;overflow:visible}
.lc .gl{stroke:var(--line);stroke-width:1}
.lc .ax{fill:var(--muted);font-size:10px;font-family:var(--font)}
.lc .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.lc .ln2{fill:none;stroke:var(--gold);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.lc .ar{fill:var(--accent);opacity:.1}
.lc .pt{fill:var(--accent);stroke:var(--phone);stroke-width:2}
.lc .vl{fill:var(--ink);font-size:11px;font-weight:600;font-family:var(--font)}
.lc .budl{stroke:var(--bad);stroke-width:1.2;stroke-dasharray:4 3}
.lc .budt{fill:var(--muted);font-size:10px;font-family:var(--font)}
.leyenda{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.leyenda span{display:inline-flex;gap:6px;align-items:center}
.leyenda i{width:14px;height:3px;border-radius:2px;display:inline-block}
.tabla{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
td.r,th.r{text-align:right}
.mrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;text-transform:capitalize}
.mrow .d{font-size:12px;text-align:right;min-width:52px}

.notif{border-radius:16px;padding:10px 12px;background:var(--ground);display:grid;grid-template-columns:30px 1fr;gap:3px 10px;font-size:13px;text-align:left;width:100%}
.notif .ap{width:30px;height:30px;border-radius:8px;background:var(--accent-soft);display:grid;place-items:center;font-size:15px;grid-row:span 2}
.notif .t{font-weight:600;display:flex;justify-content:space-between;gap:8px;font-size:14px}
.notif.visto{opacity:.72}
.notif .t .nuevo{color:var(--accent);font-weight:600;font-size:10px;letter-spacing:.04em}
.notif .t span{font-weight:400;color:var(--muted);font-size:11px;white-space:nowrap}

.vacio{text-align:center;color:var(--muted);padding:36px 12px;display:grid;gap:8px;justify-items:center}
.vacio .e{font-size:40px}

.velo{position:fixed;inset:0;background:rgba(20,15,25,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.hoja{background:var(--phone);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 18px);display:grid;gap:14px;align-content:start}
.grab{width:40px;height:5px;border-radius:99px;background:var(--line);justify-self:center}
.hoja h2{margin:0;font-size:19px;font-weight:600;overflow-wrap:anywhere}
.htop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.catlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.catopt{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px;font-size:14px;text-align:left}
.catopt.sel{border-color:var(--accent);background:var(--accent-soft)}
.emojis{display:flex;flex-wrap:wrap;gap:4px}
.emojis button{width:38px;height:38px;border-radius:10px;font-size:20px;background:var(--ground)}
.emojis button.sel{outline:2px solid var(--accent)}
.campo{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{width:20px;height:20px;flex:none;margin-top:1px}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);transform:translateX(-50%);background:var(--ink);color:var(--phone);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.cargando{display:grid;place-items:center;padding:60px;color:var(--muted)}
.sync{font-size:11px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="topbar" id="barra"><h1>Mis Lukas</h1></header>
  <main id="vista"><div class="cargando">Cargando tus lukas…</div></main>
  <nav class="tabbar" id="tabs">
    <button data-v="inicio"><span class="i">🏠</span>Inicio<span class="badge" id="badge" hidden></span></button>
    <button data-v="movs"><span class="i">📋</span>Movimientos</button>
    <button data-v="presupuesto"><span class="i">🎯</span>Presupuesto</button>
    <button data-v="subs"><span class="i">🔁</span>Suscripciones</button>

<script type="text/plain" id="widget-src">
// Mis Lukas · widget para Scriptable
// Muestra el resumen de tu Mis Lukas. La dirección de abajo lleva tu llave de solo lectura: no la compartas.
const DIRECCION = "__URL__";

const C = {
  fondo: Color.dynamic(new Color("#FFFFFF"), new Color("#26202D")),
  tinta: Color.dynamic(new Color("#2A2230"), new Color("#F3EEE4")),
  gris: Color.dynamic(new Color("#6F6776"), new Color("#ABA2B3")),
  morado: Color.dynamic(new Color("#6B5882"), new Color("#BBA9D6")),
  naranjo: new Color("#D4860B"),
  verde: Color.dynamic(new Color("#5E7A1F"), new Color("#B3CC62")),
  rojo: Color.dynamic(new Color("#B23A1E"), new Color("#F08A6C"))
};

function plata(n) {
  if (n === null || n === undefined) return "—";
  const s = String(Math.round(Math.abs(n))).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  return (n < 0 ? "−" : "") + "$" + s;
}

async function traer() {
  const fm = FileManager.local();
  const archivo = fm.joinPath(fm.documentsDirectory(), "mislukas-widget.json");
  try {
    const pedido = new Request(DIRECCION);
    pedido.timeoutInterval = 25;
    const d = await pedido.loadJSON();
    if (d && d.ok) { fm.writeString(archivo, JSON.stringify(d)); return d; }
    if (d && d.error === "llave") return { falla: "La llave cambió. Copia el código de nuevo desde Mis Lukas." };
  } catch (e) {}
  if (fm.fileExists(archivo)) {
    try { const d = JSON.parse(fm.readString(archivo)); d.viejo = true; return d; } catch (e) {}
  }
  return { falla: "Sin conexión con Mis Lukas." };
}

function texto(donde, t, tam, color, negrita) {
  const x = donde.addText(String(t));
  x.font = negrita ? Font.boldSystemFont(tam) : Font.systemFont(tam);
  x.textColor = color;
  x.lineLimit = 1;
  x.minimumScaleFactor = 0.6;
  return x;
}

function marca(donde) {
  const f = donde.addStack();
  f.centerAlignContent();
  texto(f, "Mis", 13, C.morado, true);
  f.addSpacer(3);
  texto(f, "Lukas", 13, C.naranjo, true);
  return f;
}

function porPagarTotal(d) {
  return (d.tarjetas || []).reduce(function (a, t) { return a + (t.porPagar || 0); }, 0);
}

function lineaPendientes(donde, d) {
  if (d.pendientes > 0) texto(donde, d.pendientes + " por revisar", 12, C.rojo, true);
  else texto(donde, "Todo revisado ✓", 12, C.verde, false);
}

function bloqueGasto(donde, d) {
  texto(donde, (d.modo === "facturacion" ? "Facturas en curso" : "Gastaste en " + d.mes), 11, C.gris, false);
  texto(donde, plata(d.gastado), 26, C.tinta, true);
  if (d.presupuesto) {
    const p = Math.round(d.presupuesto.usado / d.presupuesto.tope * 100);
    texto(donde, p + "% del presupuesto", 11, p >= 100 ? C.rojo : p >= 80 ? C.naranjo : C.gris, false);
  }
}

function armar(d, tam) {
  const w = new ListWidget();
  w.backgroundColor = C.fondo;
  w.refreshAfterDate = new Date(Date.now() + 15 * 60 * 1000);

  if (d.falla) {
    marca(w); w.addSpacer(6);
    const x = w.addText(d.falla); x.font = Font.systemFont(12); x.textColor = C.gris;
    return w;
  }

  // pantalla de bloqueo
  if (tam === "accessoryRectangular") {
    const a = w.addText("Mis Lukas · " + d.mes); a.font = Font.boldSystemFont(12);
    const b = w.addText(plata(d.gastado)); b.font = Font.boldSystemFont(18);
    const c = w.addText(d.pendientes > 0 ? d.pendientes + " por revisar" : "Por pagar " + plata(porPagarTotal(d))); c.font = Font.systemFont(12);
    return w;
  }
  if (tam === "accessoryInline") {
    w.addText("Mis Lukas " + plata(d.gastado) + (d.pendientes > 0 ? " · " + d.pendientes + " por revisar" : ""));
    return w;
  }

  w.setPadding(14, 14, 14, 14);

  if (tam === "small") {
    marca(w);
    w.addSpacer();
    bloqueGasto(w, d);
    w.addSpacer(6);
    texto(w, "Por pagar " + plata(porPagarTotal(d)), 12, C.tinta, false);
    lineaPendientes(w, d);
    return w;
  }

  // mediano (y grande)
  const fila = w.addStack();
  const izq = fila.addStack(); izq.layoutVertically();
  marca(izq);
  izq.addSpacer();
  bloqueGasto(izq, d);
  izq.addSpacer(6);
  lineaPendientes(izq, d);

  fila.addSpacer();

  const der = fila.addStack(); der.layoutVertically();
  texto(der, "POR PAGAR", 10, C.gris, true);
  der.addSpacer(4);
  const lista = (d.tarjetas || []).slice(0, 3);
  for (let i = 0; i < lista.length; i++) {
    const t = lista[i];
    texto(der, t.nombre, 11, C.gris, false);
    texto(der, t.porPagar === null || t.porPagar === undefined ? "—" : plata(t.porPagar), 16, C.tinta, true);
    let pie = "";
    if (t.porPagar) pie = t.vence ? "vence " + t.vence : "";
    else if (t.porPagar === 0) pie = "al día";
    if (pie) texto(der, pie, 10, t.diasVence !== null && t.diasVence !== undefined && t.diasVence <= 5 ? C.rojo : C.gris, false);
    if (i < lista.length - 1) der.addSpacer(5);
  }
  der.addSpacer();
  texto(der, (d.viejo ? "sin conexión · " : "") + d.hora, 9, C.gris, false);
  return w;
}

const datos = await traer();
const tam = config.widgetFamily || "medium";
const widget = armar(datos, tam);
if (config.runsInWidget) Script.setWidget(widget);
else await widget.presentMedium();
Script.complete();
</script>

  }

  const base = actual ? S.d.movimientos : movsMes;

  h += '<div style="display:flex;justify-content:space-between;align-items:center"><span class="sect">' + (actual ? 'Últimos movimientos' : 'Movimientos de ' + nomMes) + '</span><button class="lnk" onclick="' + (actual ? 'limpiarFiltros(true);ir(\'movs\')' : 'verMes(' + js(iniM) + ',' + js(finM) + ')') + '">Ver todos ›</button></div>';

  return h;
}

/* =================== REEMBOLSOS DE SALUD =================== */
const esReembolsoSalud = (m) => m.tipo === 'ingreso' && /reembolso/i.test(m.categoria || '') && /salud/i.test(m.categoria || '');
const esGastoSalud = (m) => m.tipo === 'gasto' && m.monto > 0 && /salud/i.test(m.categoria || '');
function reembolsado(g) { return ((g.detalle || {}).reembolsos || []).reduce((a, r) => a + Number(r.monto || 0), 0); }
/** Atenciones de salud de los 6 meses anteriores al reembolso, las más probables primero. */
function candidatosReembolso(ing) {
  const tope = String(ing.fecha).slice(0, 10), desde = fIso(new Date(fObj(ing.fecha).getTime() - 183 * 864e5));
  const vinc = {}; ((ing.detalle || {}).reembolsa || []).forEach((v) => { vinc[v.id] = Number(v.monto) || 0; });
  return S.d.movimientos.filter((g) => esGastoSalud(g) && String(g.fecha).slice(0, 10) >= desde && String(g.fecha).slice(0, 10) <= tope &&
      (vinc[g.id] != null || (!(g.detalle || {}).sinReembolso && reembolsado(g) < g.monto)))
    .map((g) => { const falta = g.monto - reembolsado(g) + (vinc[g.id] || 0); const r = ing.monto / Math.max(1, falta); return { g, falta, ya: vinc[g.id] != null, calza: r >= 0.2 && r <= 1.02 }; })
    .sort((a, b) => (b.ya - a.ya) || (b.calza - a.calza) || (a.g.fecha < b.g.fecha ? 1 : -1)).slice(0, 30);
}
function abrirReembolso(id) {
  const ing = S.d.movimientos.find((x) => x.id === id); if (!ing) return;
  const cands = candidatosReembolso(ing);
  let h = '<div class="htop"><h2>¿Qué atención cubre?</h2><button class="lnk" onclick="cerrar()">Cerrar</button></div>' +
    '<div class="muted">' + esc(ing.comercio) + ' · <span class="in">+' + clp(ing.monto) + '</span> · ' + fCorta(ing.fecha) + '. Marca la consulta, examen o compra de farmacia que te reembolsaron (pueden ser varias).</div>';
  if (!cands.length) h += '<div class="card"><b>No encontré atenciones de salud</b><span class="muted">Busqué gastos en categorías de salud de los 6 meses anteriores. Si la atención quedó en otra categoría, cámbiala a Salud y vuelve aquí.</span></div>';
  else h += '<div class="list" id="rb-lista">' + cands.map((x) => '<label class="tx" style="cursor:pointer"><input type="checkbox" data-id="' + esc(x.g.id) + '" data-falta="' + x.falta + '"' + (x.ya ? ' checked' : '') + ' style="width:22px;height:22px;justify-self:center">' +
      '<div><div class="name">' + esc(x.g.comercio) + '</div><div class="meta">' + fCorta(x.g.fecha) + ' · ' + esc(x.g.categoria) + (reembolsado(x.g) && !x.ya ? ' · ya reembolsado en parte' : '') + '</div></div>' +
      '<div class="amt num">' + clp(x.g.monto) + (x.falta < x.g.monto ? '<small>falta ' + clp(x.falta) + '</small>' : '') + '</div></label>').join('') + '</div>' +
    '<div class="muted num" id="rb-res"></div>';
  h += '<button class="btn pri full" id="rb-ok">Guardar</button>';
  abrirHoja(h);
  const resumen = () => { const sel = [...document.querySelectorAll('#rb-lista input:checked')]; const t = sel.reduce((a, i) => a + Number(i.dataset.falta), 0);
    const el = $('#rb-res'); if (el) el.textContent = sel.length ? 'Marcaste ' + clp(t) + ' en atenciones: el reembolso cubre el ' + Math.round(Math.min(ing.monto, t) / t * 100) + '%' + (ing.monto > t ? ' (y sobra ' + clp(ing.monto - t) + ')' : '') + '.' : ''; };
  document.querySelectorAll('#rb-lista input').forEach((i) => { i.onchange = resumen; }); resumen();
  $('#rb-ok').onclick = async () => {
    const ids = [...document.querySelectorAll('#rb-lista input:checked')].map((i) => i.dataset.id);
    $('#rb-ok').disabled = true; $('#rb-ok').textContent = 'Guardando…';
    try { const l = await api('api_vincularReembolso', id, ids); (l || []).forEach(reemplazar); guardarCache(); cerrar(); render(); toast(ids.length ? 'Reembolso vinculado' : 'Reembolso sin atenciones'); }
    catch (e) { $('#rb-ok').disabled = false; $('#rb-ok').textContent = 'Guardar'; error(e); }
  };
}
async function sinReembolso(id, valor) {
  const m = S.d.movimientos.find((x) => x.id === id); if (!m) return;
  const antes = m.detalle; m.detalle = Object.assign({}, m.detalle); if (valor) m.detalle.sinReembolso = true; else delete m.detalle.sinReembolso;
  cerrar(); render(); toast(valor ? 'Marcada sin reembolso' : 'Vuelve a esperar reembolso');
  try { reemplazar(await api('api_sinReembolso', id, valor)); guardarCache(); } catch (e) { m.detalle = antes; render(); error(e); }
}
/** En la categoría de salud: cuánto se reembolsó en el año y qué atenciones siguen esperando. */
function bloqueReembolsos(nombre) {
  const anio = mesActual().slice(0, 4);
  const gs = S.d.movimientos.filter((m) => esGastoSalud(m) && m.categoria === nombre && String(m.fecha).slice(0, 4) === anio);
  const total = suma(gs), reemb = gs.reduce((a, g) => a + Math.min(g.monto, reembolsado(g)), 0);
  const hace = fIso(new Date(Date.now() - 122 * 864e5));
  const esperando = S.d.movimientos.filter((m) => esGastoSalud(m) && m.categoria === nombre && String(m.fecha).slice(0, 10) >= hace && !(m.detalle || {}).sinReembolso && reembolsado(m) < m.monto)
    .sort((a, b) => (a.fecha < b.fecha ? 1 : -1));
  if (!total && !esperando.length) return '';
  let h = '<div class="card num"><span class="sect">Reembolsos ' + anio + '</span>' + kv('Gastado en ' + esc(nombre.toLowerCase()), clp(total)) +
    kv('Reembolsado', '<span class="in">+' + clp(reemb) + '</span>' + (total ? ' · ' + Math.round(reemb / total * 100) + '%' : '')) + kv('Te costó en realidad', '<b>' + clp(total - reemb) + '</b>') +
    '<span class="muted">En el presupuesto el gasto cuenta completo y el reembolso entra como ingreso; esto es solo para que sepas cuánto te costó.</span></div>';
  if (esperando.length) h += '<span class="sect">Esperando reembolso · últimos 4 meses</span><div class="list">' + esperando.slice(0, 12).map((g) => { const r = reembolsado(g);
    return '<div class="tx"><div class="ico sm">🩺</div><div><button style="text-align:left" onclick="abrirEdicion(' + js(g.id) + ')"><div class="name">' + esc(g.comercio) + '</div><div class="meta">' + fCorta(g.fecha) + (r ? ' · reembolsado ' + clp(r) : '') + '</div></button></div>' +
      '<div class="amt num">' + clp(g.monto - r) + '<small><button class="lnk" style="font-size:11px" onclick="sinReembolso(' + js(g.id) + ',true)">No tiene</button></small></div></div>'; }).join('') + '</div>';
  return h;
}

  $('#nv-medios').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; leer(); n.medio = b.dataset.medio; abrirNuevo(true); };

  // si ya anotaste o confirmaste algo con ese mismo nombre, propone su categoría
  $('#nv-com').onchange = () => { leer(); if (n.categoria) return;
    const k = n.comercio.trim().toLowerCase(); if (!k) return;
    const prev = S.d.movimientos.filter((m) => m.tipo === n.tipo && m.categoria && String(m.comercio).trim().toLowerCase() === k).sort((a, b) => (a.fecha < b.fecha ? 1 : -1))[0];
    if (prev) { n.categoria = prev.categoria; abrirNuevo(true); } };
  $('#nv-ok').onclick = async () => {
    leer();
    if (!Number(n.monto)) { toast('Escribe el monto'); return; }
    if (!n.comercio.trim()) { toast(n.tipo === 'ingreso' ? 'Escribe de qué es' : 'Escribe dónde o en qué'); return; }
    if (!n.fecha) { toast('Elige la fecha'); return; }
    if (!n.categoria) { toast('Elige una categoría'); return; }
    $('#nv-ok').disabled = true; $('#nv-ok').textContent = 'Guardando…';
    try { const r = await api('api_crearMovimiento', { tipo: n.tipo, monto: Number(n.monto), comercio: n.comercio.trim(), fecha: n.fecha, medio: n.medio, categoria: n.categoria, notas: n.notas });
      S.d.movimientos.push(r.mov); if (r.medios) S.d.medios = r.medios; guardarCache(); cerrar(); render(); toast('Movimiento agregado'); }
    catch (e) { $('#nv-ok').disabled = false; $('#nv-ok').textContent = 'Guardar'; error(e); }
  };
}

function ordenRevisar(m) { return m.pregunta === 'sin_reconocer' ? 0 : m.pregunta === 'monto_pendiente' ? 1 : m.pregunta ? 2 : !m.categoria && m.tipo === 'gasto' ? 3 : 4; }
function listoParaConfirmar(m) { return m.monto != null && !['monto_pendiente', 'intermediario', 'sin_reconocer', 'pago_tarjeta'].includes(m.pregunta) && !(m.tipo === 'abono' && !(m.detalle && m.detalle.medioAbono)) && !(m.tipo === 'gasto' && !m.categoria); }
function vRevisar() {
  const lista = S.d.movimientos.filter((m) => m.estado === 'por_revisar').sort((a, b) => ordenRevisar(a) - ordenRevisar(b) || (a.fecha < b.fecha ? 1 : -1));
  if (!lista.length) return '<div class="vacio"><div class="e">🎉</div><b>Todo revisado</b><div>Cuando llegue un cobro nuevo aparecerá aquí.</div></div><button class="lnk" style="justify-self:center" onclick="revisarAhora()">↻ Revisar mis correos ahora</button>';
  const listos = lista.filter(listoParaConfirmar).length;
  let h = '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="muted">' + lista.length + ' por revisar</span>' +
    (listos ? '<button class="btn pri" onclick="confirmarTodos()">Confirmar ' + (listos === lista.length ? 'todos' : listos + ' listos') + '</button>' : '') + '</div>';
  return h + lista.map(tarjetaRevisar).join('') + '<button class="lnk" onclick="revisarAhora()">↻ Revisar mis correos ahora</button>';
}
function nombrePick(m) {
  if (m.tipo === 'entre_cuentas') return '🔁 Entre mis cuentas';
  if (m.tipo === 'abono') return '💳 Abono a ' + esc(m.detalle && m.detalle.medioAbono ? medio(m.detalle.medioAbono).nombre : 'tarjeta');
  const c = cat(m.categoria); return c ? esc(c.emoji + ' ' + c.nombre) : (m.tipo === 'ingreso' ? 'Elegir tipo de ingreso' : 'Elegir categoría');
}
function tarjetaRevisar(m) {
  const q = m.pregunta || (!m.categoria && m.tipo === 'gasto' ? 'nuevo' : '');
  const id = js(m.id);
  let hint = '', extra = '';
  if (q === 'nuevo') hint = 'Comercio nuevo: elige una categoría';
  if (q === 'intermediario') {
    hint = '¿Qué pagaste en ' + esc(m.comercio) + '?';
    extra = '<div class="chips">' + tarjetas().map((t) => '<button class="chip" onclick="elegir(' + id + ',{tipo:\'abono\',medioAbono:' + js(t.codigo) + '},true)">💳 Abono ' + esc(t.nombre) + '</button>').join('') +
      '<button class="chip" onclick="elegir(' + id + ',{tipo:\'gasto\',categoria:\'Hogar\'},true)">🏠 Cuenta de la casa</button><button class="chip" onclick="abrirPicker(' + id + ',true)">Otra cosa…</button></div>';
  }
  if (q === 'transferencia') {
    hint = m.tipo === 'entre_cuentas' ? 'Parece un traspaso a una cuenta tuya' : '¿Es un gasto o un traspaso entre tus cuentas?';
    extra = '<div class="chips"><button class="chip' + (m.tipo === 'entre_cuentas' ? ' on' : '') + '" onclick="elegir(' + id + ',{tipo:\'entre_cuentas\'},true)">🔁 Entre mis cuentas</button><button class="chip" onclick="abrirPicker(' + id + ',true,\'gasto\')">Es un gasto…</button></div>';
  }
  if (q === 'pago_tarjeta' || (m.tipo === 'abono' && !(m.detalle && m.detalle.medioAbono))) {
    hint = 'Pago de tarjeta: no cuenta como gasto. ¿A cuál tarjeta fue?';
    extra = '<div class="chips">' + tarjetas().map((t) => '<button class="chip" onclick="elegir(' + id + ',{tipo:\'abono\',medioAbono:' + js(t.codigo) + '},true)">💳 ' + esc(t.nombre) + '</button>').join('') +
      '<button class="chip" onclick="abrirPicker(' + id + ',true,\'gasto\')">No, es un gasto…</button></div>';
  }
  if (q === 'ingreso') hint = 'Llegó plata: ¿de qué es?';
  if (esReembolsoSalud(m)) { const v = (m.detalle && m.detalle.reembolsa) || [];
    extra += '<div class="chips"><button class="chip' + (v.length ? ' on' : '') + '" onclick="abrirReembolso(' + id + ')">🩺 ' + (v.length ? 'Cubre ' + v.length + (v.length === 1 ? ' atención' : ' atenciones') : '¿Qué atención cubre?') + '</button></div>'; }
  if (sentidoDe(m) === 'credito' && !m.categoria) hint = 'Crédito en tu tarjeta: ¿a qué categoría descuenta?';
  const sugerida = !q && m.categoria && (m.tipo === 'gasto' || m.tipo === 'ingreso');
  if (sugerida) hint = '<span style="color:var(--accent)">Categoría sugerida según lo que has confirmado antes</span>';
  if (q === 'monto_pendiente') {
    hint = 'El aviso no trae el monto';
    const sug = m.detalle && m.detalle.montoSugerido;
    extra = '<div class="montoin"><input id="monto-' + esc(m.id) + '" inputmode="numeric" placeholder="Monto" value="' + (sug ? Math.round(sug) : '') + '" aria-label="Monto">' +
      '<span class="muted">' + (sug ? 'Sugerido: el mes anterior' : 'Escríbelo, o calcúlalo con la UF') + '</span></div>' +
      (String(m.clave).indexOf('CREDITO:') === 0 ? '<button class="lnk" onclick="editarUF(' + js(m.clave) + ')">Calcularlo solo con la UF ›</button>' : '');
  }
  if (q === 'sin_reconocer') {
    hint = 'Aviso sin reconocer: revisa el monto y elige qué es';
    extra = (m.detalle && m.detalle.extracto ? '<div class="extracto">' + esc(m.detalle.extracto) + '</div>' : '') + '<div class="chips"><button class="chip" onclick="ignorarTipo(' + id + ')">🚫 No es un movimiento</button></div>';
  }
  const conf = q === 'monto_pendiente' ? 'confirmarConMonto(' + id + ')' : listoParaConfirmar(m) ? 'elegir(' + id + ',{},true)' : 'abrirPicker(' + id + ',true)';
  const comp = m.detalle && m.detalle.compartido;
  return '<div class="rv' + (q && q !== 'ingreso' ? ' q' : '') + '">' +
    '<div class="h"><span class="name">' + esc(m.comercio) + '</span>' + montoHtml(m) + '<span class="meta">' + etiquetaMedio(m.medio) + ' · ' + fCorta(m.fecha) + (m.estimado && m.detalle && m.detalle.uf ? ' <span class="tag">ESTIMADO EN UF</span>' : '') + '</span></div>' +
    (hint ? '<span class="hint">' + hint + '</span>' : '') + extra +
    '<div class="act"><button class="pick" onclick="abrirPicker(' + id + ',true)">' + nombrePick(m) + (sugerida ? ' <span class="tag auto">SUGERIDA</span>' : '') + '</button>' +
    (m.tipo === 'gasto' && m.monto > 0 ? '<button class="btn" onclick="abrirCompartir(' + id + ')">' + (comp ? '🤝 ' + esc(comp.persona) : 'Compartir') + '</button>' : '') +
    (m.tipo === 'gasto' && m.monto > 0 && esTarjeta(m.medio) ? '<button class="btn" onclick="abrirCuotas(' + id + ')">' + (nCuotas(m) > 1 ? nCuotas(m) + ' cuotas' : 'Cuotas') + '</button>' : '') +
    '<button class="ok-btn" aria-label="Confirmar" onclick="' + conf + '">✓</button></div></div>';
}
/** confirmación inmediata: se ve al tiro y se guarda en segundo plano */
async function elegir(id, cambios, confirmar) {
  const i = S.d.movimientos.findIndex((x) => x.id === id); if (i < 0) return;
  const antes = JSON.parse(JSON.stringify(S.d.movimientos[i]));
  const m = S.d.movimientos[i];
  if (cambios.tipo && !tipoCompatible(m, cambios.tipo)) { toast(sentidoDe(m) === 'credito' ? 'Es un crédito en tu tarjeta: solo eliges la categoría' : sentidoDe(m) === 'entra' ? 'Es plata que entró: solo eliges de qué es' : 'Es un cargo: no puede quedar como ingreso'); return; }
  if (!m.detalle || !m.detalle.sentido) m.detalle = Object.assign({}, m.detalle, { sentido: sentidoDe(m) });
  if (cambios.tipo) m.tipo = cambios.tipo;
  if (cambios.categoria !== undefined) m.categoria = cambios.categoria;
  if (m.tipo === 'abono' || m.tipo === 'entre_cuentas') m.categoria = '';
  if (cambios.medioAbono) m.detalle = Object.assign({}, m.detalle, { medioAbono: cambios.medioAbono });
  if (cambios.monto) { m.monto = Math.abs(cambios.monto) * (sentidoDe(m) === 'credito' ? -1 : 1); m.estimado = false; }
  if (cambios.notas !== undefined) m.notas = cambios.notas;
  if (cambios.cuotas !== undefined) { const det = Object.assign({}, m.detalle); if (cambios.cuotas > 1) { det.cuotas = cambios.cuotas; det.valorCuota = cambios.valorCuota || ''; } else { delete det.cuotas; delete det.valorCuota; } m.detalle = det; }
  if (confirmar) {
    if (m.monto == null) { S.d.movimientos[i] = antes; toast('Falta el monto para confirmar'); return; }
    if (m.tipo === 'gasto' && !m.categoria) { S.d.movimientos[i] = antes; abrirPicker(id, true); return; }
    m.estado = 'confirmado'; m.pregunta = '';
    propagarLocal(m);
  }
  cerrar(); render(); if (confirmar) toast('Confirmado');
  if (confirmar && esReembolsoSalud(m) && !((m.detalle || {}).reembolsa || []).length && candidatosReembolso(m).length) setTimeout(() => abrirReembolso(id), 350);
  try { const r = await api('api_guardar', id, cambios, confirmar); reemplazar(r); guardarCache();
    if ((r.detalle && r.detalle.compartido && !(antes.detalle && antes.detalle.compartido)) || r.propagados) cargar(true); else render(); }
  catch (e) { S.d.movimientos[i] = antes; render(); error(e); }
}
/** lo que confirmas se sugiere al tiro a los otros pendientes del mismo comercio (el servidor hace lo mismo) */
function propagarLocal(m) {
  const inter = /^(SERVIPAG|KHIPU|WEBPAY|ETPAY|FLOW|MERCADO ?PAGO|PAYKU|TRANSBANK)\b/i.test(String(m.comercio).trim());
  if (inter) return;
  const rut = m.detalle && m.detalle.rut;
  S.d.movimientos.forEach((x) => {
    if (x.id === m.id || x.estado !== 'por_revisar' || x.pregunta === 'sin_reconocer') return;
    if (sentidoDe(x) !== sentidoDe(m)) return;
    const mismoRut = m.tipo === 'entre_cuentas' && rut && x.detalle && x.detalle.rut === rut;
    if (x.clave !== m.clave && !mismoRut) return;
    x.tipo = m.tipo; x.categoria = m.categoria;
    if (m.tipo === 'abono' && m.detalle && m.detalle.medioAbono) x.detalle = Object.assign({}, x.detalle, { medioAbono: m.detalle.medioAbono });
    if (['transferencia', 'pago_tarjeta', 'ingreso'].includes(x.pregunta)) x.pregunta = '';
  });
}
function confirmarConMonto(id) {
  const n = Number(String(($('#monto-' + id) || {}).value || '').replace(/[^\d]/g, ''));
  if (!n) { toast('Escribe el monto para confirmar'); return; }
  elegir(id, { monto: n }, true);
}
async function confirmarTodos() {
  const ids = S.d.movimientos.filter((m) => m.estado === 'por_revisar' && listoParaConfirmar(m)).map((m) => m.id);
  const copia = JSON.parse(JSON.stringify(S.d.movimientos));
  S.d.movimientos.forEach((m) => { if (ids.includes(m.id)) { m.estado = 'confirmado'; m.pregunta = ''; } });
  render(); toast(ids.length + ' confirmados');
  try { await api('api_confirmarVarios', ids); cargar(true); } catch (e) { S.d.movimientos = copia; render(); error(e); }
}
async function ignorarTipo(id) {
  const copia = S.d.movimientos.slice(); S.d.movimientos = S.d.movimientos.filter((m) => m.id !== id); render(); toast('Listo, no volverá a aparecer');
  try { await api('api_ignorarTipo', id); guardarCache(); } catch (e) { S.d.movimientos = copia; render(); error(e); }
}
function reemplazar(m) { const i = S.d.movimientos.findIndex((x) => x.id === m.id); if (i >= 0) S.d.movimientos[i] = m; }
async function revisarAhora() {
  toast('Revisando tus correos…');
  try { const r = await api('api_leerAhora'); await cargar(); toast(r && r.nuevos ? r.nuevos + ' movimiento(s) nuevo(s)' : 'Todo al día'); } catch (e) { error(e); }
}

/* cuotas */
function abrirCuotas(id) {
  const m = S.d.movimientos.find((x) => x.id === id);
  const st = { n: nCuotas(m), v: m.detalle && m.detalle.valorCuota ? Number(m.detalle.valorCuota) : '' };
  const dibujar = () => {
    const calc = st.n > 1 ? Math.round(m.monto / st.n) : m.monto;
    let h = '<div class="htop"><h2>¿En cuántas cuotas?</h2><button class="lnk" onclick="cerrar()">Cerrar</button></div>';
    h += '<div class="muted">' + esc(m.comercio) + ' · ' + clp(m.monto) + '</div>';
    h += '<div class="chips">' + [1, 2, 3, 4, 6, 10, 12, 18, 24, 36].map((n) => '<button class="chip' + (st.n === n ? ' on' : '') + '" data-n="' + n + '">' + (n === 1 ? 'Al contado' : n) + '</button>').join('') + '</div>';
    if (st.n > 1) h += '<label class="campo">Valor de cada cuota (si tiene interés, escríbelo; si no, se divide en partes iguales)<input id="cu-v" inputmode="numeric" placeholder="' + clp(calc) + '" value="' + (st.v || '') + '"></label>';
    h += '<div class="card num">' + (st.n > 1 ? kv('Este mes se factura', clp(st.v || calc)) + kv('Quedan después', (st.n - 1) + ' cuotas · ' + clp((st.v || calc) * (st.n - 1))) : kv('Se factura completo', clp(m.monto))) + '</div>';
    h += '<button class="btn pri full" id="cu-ok">Guardar</button>';
    abrirHoja(h);
    $('.hoja').onclick = (e) => { const b = e.target.closest('button[data-n]'); if (b) { st.n = Number(b.dataset.n); dibujar(); } };
    if ($('#cu-v')) $('#cu-v').onchange = (e) => { st.v = Number(e.target.value.replace(/\D/g, '')) || ''; dibujar(); };
    $('#cu-ok').onclick = () => { if ($('#cu-v')) st.v = Number($('#cu-v').value.replace(/\D/g, '')) || ''; elegir(id, { cuotas: st.n, valorCuota: st.v || '' }, false); toast(st.n > 1 ? st.n + ' cuotas guardadas' : 'Al contado'); };
  };
  dibujar();
}

/* compartir */
function abrirCompartir(id) {

function rangoFechas(f) {
  const hoy = new Date();
  if (f.rango === 'mes') return [fIso(new Date(hoy.getFullYear(), hoy.getMonth(), 1)), fIso(hoy)];
  if (f.rango === 'anterior') return [fIso(new Date(hoy.getFullYear(), hoy.getMonth() - 1, 1)), fIso(new Date(hoy.getFullYear(), hoy.getMonth(), 0))];
  if (f.rango === 'd7') return [fIso(new Date(Date.now() - 6 * 864e5)), fIso(hoy)];
  if (f.rango === 'd30') return [fIso(new Date(Date.now() - 29 * 864e5)), fIso(hoy)];
  if (f.rango === 'fact') { const ps = tarjetas().filter((t) => t.cierre && (!f.medios.length || f.medios.includes(t.codigo))).map((t) => periodoDe(t.cierre, hoy)); return ps.length ? [ps.map((p) => p.iniS).sort()[0], fIso(hoy)] : [fIso(new Date(hoy.getFullYear(), hoy.getMonth(), 1)), fIso(hoy)]; }
  if (f.rango === 'fechas') return [f.desde || '0000', f.hasta || '9999'];
  return ['0000', '9999'];
}
function filtrar(f) {
  const [d, h] = rangoFechas(f);
  const q = (f.q || '').toLowerCase().trim(); const qn = q.replace(/[^\d]/g, '');
  return S.d.movimientos.filter((m) => {
    const dia = String(m.fecha).slice(0, 10);
    if (dia < d || dia > h) return false;
    if (f.medios.length && !f.medios.includes(m.medio)) return false;
    if (f.tipos.length && !f.tipos.includes(m.tipo)) return false;
    if (f.cats.length && !f.cats.includes(m.categoria)) return false;
    if (f.min && (m.monto || 0) < Number(f.min)) return false;
    if (f.max && (m.monto || 0) > Number(f.max)) return false;
    if (q && !(String(m.comercio).toLowerCase().includes(q) || String(m.categoria).toLowerCase().includes(q) || String(m.notas || '').toLowerCase().includes(q) || (qn.length >= 3 && m.monto && String(Math.round(m.monto)).includes(qn)))) return false;
    return true;
  }).sort((a, b) => (a.fecha < b.fecha ? 1 : -1));
}

/* =================== DETALLE DE CATEGORÍA =================== */
function abrirCategoria(n) { S.categoria = n; S.comparar = ''; S.verTabla = false; ir('categoria'); }
function serieCat(nombre, meses) { return meses.map((k) => suma(facturables().filter((m) => (m.tipo === 'gasto' || m.tipo === 'ingreso') && m.monto != null && m.categoria === nombre && mesClave(m.fecha) === k))); }
function vCategoria() {
  const c = cat(S.categoria); if (!c) return '<div class="vacio">Categoría no encontrada.</div>';
  let n = S.rangoCat;
  if (n === 0) { const primera = S.d.movimientos.filter((m) => m.categoria === c.nombre).map((m) => mesClave(m.fecha)).sort()[0] || mesActual(); n = 1; let k = mesActual(); while (k > primera && n < 60) { k = mesAnt(k); n++; } n = Math.max(n, 2); }
  const meses = []; for (let i = n - 1; i >= 0; i--) meses.push(mesAnt(mesActual(), i));
  const s1 = serieCat(c.nombre, meses), s2 = S.comparar ? serieCat(S.comparar, meses) : null;
  const conDatos = s1.filter((v) => v > 0);
  const prom = conDatos.length ? Math.round(conDatos.reduce((a, b) => a + b, 0) / conDatos.length) : 0;
  const pIdx = s1.findIndex((v) => v > 0); const base = pIdx >= 0 ? s1[pIdx] : 0, ult = s1[s1.length - 1];
  const tend = base ? Math.round((ult - base) / base * 100) : 0;
  let h = '<div class="seg">' + [[6, '6 meses'], [12, '12 meses'], [24, '2 años'], [0, 'Todo']].map((x) => '<button class="' + (S.rangoCat === x[0] ? 'on' : '') + '" onclick="S.rangoCat=' + x[0] + ';render()">' + x[1] + '</button>').join('') + '</div>';
  h += '<div class="stat2 num"><div class="stat"><span>Promedio mensual</span><b>' + clp(prom) + '</b><span>meses con movimientos</span></div>' +
    '<div class="stat"><span>Tendencia</span><b style="color:' + (tend > 0 && c.tipo === 'gasto' ? 'var(--bad)' : tend !== 0 ? 'var(--ok)' : 'var(--ink)') + '">' + (tend > 0 ? '↑ ' : tend < 0 ? '↓ ' : '') + Math.abs(tend) + '%</b><span>vs. ' + (pIdx >= 0 ? nombreMes(meses[pIdx]) : '—') + '</span></div></div>';
  h += grafico(meses, s1, s2, c.presupuesto);
  if (c.tipo === 'gasto' && /salud/i.test(c.nombre)) h += bloqueReembolsos(c.nombre);
  if (s2) h += '<div class="leyenda"><span><i style="background:var(--accent)"></i>' + esc(c.nombre) + '</span><span><i style="background:var(--gold)"></i>' + esc(S.comparar) + '</span></div>';
  h += '<div class="chips"><button class="chip' + (S.comparar ? ' on' : '') + '" onclick="elegirComparar()">' + (S.comparar ? 'Comparando con ' + esc(S.comparar) + ' ✕' : '＋ Comparar con otra categoría') + '</button><button class="chip' + (S.verTabla ? ' on' : '') + '" onclick="S.verTabla=!S.verTabla;render()">Ver en tabla</button><button class="chip" onclick="editarCat(' + js(c.nombre) + ')">✏️ Editar</button></div>';
  if (S.verTabla) h += '<div class="tabla"><table class="num"><thead><tr><th>Mes</th><th class="r">' + esc(c.nombre) + '</th>' + (s2 ? '<th class="r">' + esc(S.comparar) + '</th>' : '') + '</tr></thead><tbody>' +
    meses.map((k, i) => '<tr><td style="text-transform:capitalize">' + nombreMes(k) + ' ' + k.slice(2, 4) + '</td><td class="r">' + clp(s1[i]) + '</td>' + (s2 ? '<td class="r">' + clp(s2[i]) + '</td>' : '') + '</tr>').join('') + '</tbody></table></div>';
  h += '<span class="sect">Últimos meses</span><div>' + meses.slice(-4).reverse().map((k) => {
    const i = meses.indexOf(k); const v = s1[i], p = i > 0 ? s1[i - 1] : 0; const d = p ? Math.round((v - p) / p * 100) : null;
    return '<button class="mrow num" onclick="verMesCat(' + js(k) + ',' + js(c.nombre) + ')"><span>' + nombreMes(k) + '</span><b>' + clp(v) + '</b><span class="d" style="color:' + (d > 0 ? 'var(--bad)' : 'var(--ok)') + '">' + (d == null ? '' : (d > 0 ? '+' : '') + d + '%') + '</span></button>';
  }).join('') + '</div>';
  return h;
}
function verMesCat(k, n) { const [y, m] = k.split('-').map(Number); S.f = Object.assign(S.f, { rango: 'fechas', desde: k + '-01', hasta: fIso(new Date(y, m, 0)), cats: [n], medios: [], tipos: [], q: '' }); ir('movs'); }
function elegirComparar() {
  if (S.comparar) { S.comparar = ''; render(); return; }
  const c = cat(S.categoria);
  abrirHoja('<div class="htop"><h2>Comparar con</h2><button class="lnk" onclick="cerrar()">Cerrar</button></div><div class="catlist">' + catsActivas(c.tipo).filter((x) => x.nombre !== c.nombre).map((x) =>
    '<button class="catopt" onclick="S.comparar=' + js(x.nombre) + ';cerrar();render()"><span class="ico sm">' + esc(x.emoji) + '</span>' + esc(x.nombre) + '</button>').join('') + '</div>');
}
function grafico(meses, s1, s2, presupuesto) {
  const W = 330, x0 = 44, x1 = 316, yT = 16, yB = 140;
  const todos = s1.concat(s2 || [], presupuesto ? [presupuesto] : []);
  let max = Math.max(...todos, 1000); const paso = Math.pow(10, Math.floor(Math.log10(max))); max = Math.ceil(max * 1.1 / paso) * paso;
  const n = meses.length, X = (i) => (n === 1 ? (x0 + x1) / 2 : x0 + (x1 - x0) * i / (n - 1)), Y = (v) => yB - v / max * (yB - yT);
  let g = '<svg viewBox="0 0 ' + W + ' 164" class="lc" role="img" aria-label="Gasto mensual en la categoría, ' + meses.length + ' meses">';
  [0.25, 0.5, 0.75, 1].map((t) => max * t).forEach((t) => { g += '<line x1="' + x0 + '" x2="' + x1 + '" y1="' + Y(t).toFixed(1) + '" y2="' + Y(t).toFixed(1) + '" class="gl"/><text x="' + (x0 - 6) + '" y="' + (Y(t) + 3.5).toFixed(1) + '" class="ax" text-anchor="end">' + clpk(t) + '</text>'; });
  g += '<line x1="' + x0 + '" x2="' + x1 + '" y1="' + yB + '" y2="' + yB + '" class="gl"/>';
  if (presupuesto) g += '<line x1="' + x0 + '" x2="' + x1 + '" y1="' + Y(presupuesto).toFixed(1) + '" y2="' + Y(presupuesto).toFixed(1) + '" class="budl"/><text x="' + (x0 + 4) + '" y="' + (Y(presupuesto) - 5).toFixed(1) + '" class="budt">Presupuesto ' + clpk(presupuesto) + '</text>';
  const pts = s1.map((v, i) => X(i).toFixed(1) + ',' + Y(v).toFixed(1));
  g += '<path d="M' + X(0).toFixed(1) + ',' + yB + ' L' + pts.join(' L') + ' L' + X(n - 1).toFixed(1) + ',' + yB + ' Z" class="ar"/>';
  if (s2) g += '<polyline points="' + s2.map((v, i) => X(i).toFixed(1) + ',' + Y(v).toFixed(1)).join(' ') + '" class="ln2"/>';
  g += '<polyline points="' + pts.join(' ') + '" class="ln"/>';
  const yl = Y(s1[n - 1]);
  g += '<circle cx="' + X(n - 1).toFixed(1) + '" cy="' + yl.toFixed(1) + '" r="5" class="pt"/><text x="' + (X(n - 1) - 8).toFixed(1) + '" y="' + (yl < yT + 12 ? yl + 16 : yl - 8).toFixed(1) + '" class="vl" text-anchor="end">' + clp(s1[n - 1]) + '</text>';
  const cada = Math.ceil(n / 6);
  meses.forEach((k, i) => { if ((n - 1 - i) % cada === 0) g += '<text x="' + X(i).toFixed(1) + '" y="158" class="ax" text-anchor="middle">' + nombreMes(k).slice(0, 3) + '</text>'; });
  return g + '</svg>';
}

  if (!vFuentes.pedido) { vFuentes.pedido = true; api('api_cartolasPendientes').then((l) => { S.pendientes = l || []; if (S.vista === 'fuentes') render(); }).catch(() => {}); api('api_claveCartolas').then((c) => { S.claves = listaClaves(c); if (S.vista === 'fuentes') render(); }).catch(() => {}); }
  const c = S.d.config;
  let h = '<span class="sect">Correos conectados</span><div class="grupo">' + (c.lecturas.length ? c.lecturas.map((l) =>
    '<div class="fila"><span>✉️</span><span style="overflow-wrap:anywhere">' + esc(l.correo) + '</span><small>Última revisión: ' + fCorta(l.fecha) + ' · versión ' + esc(l.version || 'anterior a 0.6') + '</small>' + (l.correo !== c.correoPrincipal && l.version !== S.d.version ? '<span class="v" style="color:var(--warn)">Actualizar</span>' : '<span class="v" style="color:var(--ok)">Conectado</span>') + '</div>').join('') : '<div class="fila"><span>✉️</span><span>Aún no hay lecturas</span></div>') + '</div>';
  h += '<button class="btn full" onclick="revisarAhora()">↻ Revisar mis correos ahora</button>';
  h += '<button class="btn pri full" onclick="subirCartola()">📄 Subir cartola (PDF)</button>';
  h += '<div class="muted">Sirve la cartola original que te llega al correo, con clave. Se abre y se lee aquí mismo; antes de guardar nada verás lo que leyó. Lee la cuenta corriente, la línea de crédito y la tarjeta de crédito del Banco de Chile (pesos y dólares), y la tarjeta Cencosud.</div>';
  if (!S.fuentesRecien && S.pendientes) { S.fuentesRecien = new Set(idsFuentes().filter((i) => !esVisto(i))); setTimeout(marcarVistosFuentes, 0); }
  const recien = S.fuentesRecien || new Set();
  const todas = S.pendientes || [];
  const pend = S.verTodasCart ? todas : todas.filter((x) => recien.has('cart:' + x.msgId));
  if (todas.length > pend.length) h += '<button class="lnk" onclick="S.verTodasCart=true;render()">Ver las cartolas de tu correo sin leer (' + todas.length + ') ›</button>';
  if (pend.length) h += '<span class="sect">' + (S.verTodasCart ? 'Cartolas de tu correo sin leer' : 'Cartolas nuevas en tu correo') + '</span><div class="list">' + pend.map((x) => '<div class="tx"><div class="ico">📬</div><div><div class="name">' + esc(x.asunto) + '</div><div class="meta">' + fCorta(x.fecha) + '</div></div><button class="btn pri" onclick="leerDeCorreo(' + js(x.msgId) + ')">Leer</button></div>').join('') + '</div>';
  const leidas = (S.d.cartolasLeidas || []).slice().sort((a, b) => (a.importado < b.importado ? 1 : -1));
  h += '<span class="sect">Cartolas leídas</span>' + (leidas.length ? '<div class="list">' + leidas.map((x) => '<div class="tx"><div class="ico">🏦</div><div><div class="name">' + esc(medio(x.medio).nombre) + (x.tipo === 'tci' ? ' · dólares' : '') + '</div><div class="meta">' + (x.desde ? fCorta(x.desde) + ' – ' : '') + fCorta(x.hasta) + ' · ' + x.verificados + ' verificados · ' + x.nuevos + ' nuevos</div></div>' +
    (x.totalFacturado != null && x.tipo !== 'cc' ? '<div class="amt num">' + (x.tipo === 'tci' ? 'US$' + x.totalFacturado : clp(x.totalFacturado)) + '<small>facturado</small></div>' : x.saldoFinal != null ? '<div class="amt num">' + clp(x.saldoFinal) + '<small>saldo final</small></div>' : '') + '</div>').join('') + '</div>' : '<div class="muted">Aún no has leído cartolas.</div>');
  h += '<div class="grupo"><button class="fila" onclick="editarClave()"><span>🔑</span><span>Claves de las cartolas</span><small>' + ((S.claves || []).length ? S.claves.length + ((S.claves.length === 1) ? ' clave guardada' : ' claves guardadas') + ' en tu cuenta' : 'Se pide la primera vez que abras una cartola') + '</small><span class="v">Cambiar ›</span></button></div>';
  const sms = S.d.config.sms || {};
  h += '<span class="sect">SMS de Cencosud</span>';
  if (sms.url && sms.listo) {
    h += '<div class="grupo"><div class="fila"><span>📱</span><span>Atajo del iPhone</span><small>' + (sms.recibidos ? sms.recibidos + ' avisos recibidos (SMS y Apple Pay) · último ' + fCorta(sms.ultimo) : 'Conectado. Aún no llega ningún SMS') + '</small><span class="v" style="color:var(--ok)">Conectado</span></div>' +
      '<button class="fila" onclick="conectarSms()"><span>⚙️</span><span>Ver los pasos de nuevo</span><small>Receptor, URL, SMS y Apple Pay</small><span class="v">›</span></button></div>';
    const noRec = S.verTodosSms ? (sms.noReconocidos || []) : (sms.noReconocidos || []).filter((x) => recien.has('sms:' + x.id));
    if ((sms.noReconocidos || []).length > noRec.length) h += '<button class="lnk" onclick="S.verTodosSms=true;render()">Ver los avisos que no reconocí (' + sms.noReconocidos.length + ') ›</button>';
    if (noRec.length) h += '<div class="card"><b>Avisos que no reconocí</b><span class="muted">Si alguno es un movimiento, mándame el texto y lo agrego.</span>' + noRec.map((x) => '<div class="extracto">' + esc(x.texto) + '</div>').join('') + '</div>';
  } else {
    h += '<div class="muted">El iPhone no deja que una app lea tus mensajes. Con una automatización de Atajos, cada SMS de compra de Cencosud (y, si quieres, cada pago con Apple Pay) se manda solo a Mis Lukas y aparece en Por revisar en unos minutos.</div>' +
      '<button class="btn full" onclick="conectarSms()">📱 Conectar los SMS de Cencosud</button>';
  }
  return h;
}

/* ---------- SMS de Cencosud: pasos para conectar el atajo ---------- */
function copiar(texto, aviso) {
  const ok = () => toast(aviso || 'Copiado');
  const viejo = () => { const t = document.createElement('textarea'); t.value = texto; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0'; document.body.appendChild(t); t.select(); t.setSelectionRange(0, texto.length);
    try { document.execCommand('copy'); ok(); } catch (e) { toast('No pude copiar: mantén presionado el texto y cópialo'); } t.remove(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(texto).then(ok, viejo); else viejo();
}

    (urlAtajo ? '<div class="extracto" style="overflow-wrap:anywhere">' + esc(urlAtajo) + '</div><button class="btn pri full" onclick="copiar(' + js(urlAtajo) + ',\'URL copiada\')">Copiar URL para el atajo</button>'
      : '<div class="hint">Primero guarda la URL del paso 2: aquí aparecerá la URL para el atajo, con tu clave secreta.</div>'));
  h += paso(4, 'Listo', '<span class="muted">Desde la próxima compra, el SMS aparece en Por revisar en unos 10 minutos (o al tocar "Revisar mis correos ahora"). Los códigos y claves que mande Cencosud nunca se guardan.</span>');
  h += paso(5, 'Compras con Apple Pay (opcional, iPhone)',

    '<li>En la casilla de la derecha arma esta frase: escribe <b>Apple Pay</b> y un espacio; en la barra sobre el teclado toca <b>Entrada del atajo</b>, luego toca ese globito azul y elige <b>Importe</b> (o Monto). Escribe un espacio, <b>en</b> y otro espacio; inserta otra vez <b>Entrada del atajo</b> y elige <b>Comerciante</b>.</li>' +
    '<li>Tiene que quedar así: <b>Apple Pay</b> [Importe] <b>en</b> [Comerciante]. Toca <b>OK</b>.</li></ol>' +
    '<span class="muted">Funciona cuando pagas acercando el iPhone. Si alguna compra no se activa (por internet o con el reloj), igual llega con el SMS o con la cartola.</span>');

/* ==== LECTOR DE CARTOLAS (se copia tal cual dentro de Index.html) ==== */
/**
 * Convierte los textos de pdf.js en filas: agrupa por altura y une los trozos cercanos en celdas.
 * paginas: [[{str, x, y, w}]]  →  [{pagina, y, celdas:[{t, x, r}], txt}]
 */
function filasPdf(paginas) {
  const filas = [];
  paginas.forEach((items, p) => {
    const vis = items.filter((i) => String(i.str).trim() !== '').map((i) => ({ t: String(i.str).replace(/[\u2212\u2013\u2014]/g, '-').replace(/\u00a0/g, ' '), x: i.x, r: i.x + (i.w || 0), y: i.y, h: i.h || 0 }));
    vis.sort((a, b) => b.y - a.y || a.x - b.x);
    const grupos = [];
    vis.forEach((i) => {
      // misma fila si la altura calza con el promedio del grupo (tolerancia: ~40% del alto de la letra, entre 2,2 y 3,6 pt)
      const tol = Math.min(3.6, Math.max(2.2, (i.h || 7) * 0.4));
      const g = grupos.find((gr) => Math.abs(gr.y - i.y) <= tol);
      if (g) { g.items.push(i); g.y = g.items.reduce((a, x) => a + x.y, 0) / g.items.length; } else grupos.push({ y: i.y, items: [i] });
    });
    grupos.sort((a, b) => b.y - a.y).forEach((g) => {
      const its = g.items.sort((a, b) => a.x - b.x);
      const celdas = [];
      its.forEach((i) => {
        const u = celdas[celdas.length - 1];
        if (u && i.x - u.r < 2.5) { u.t += (i.x - u.r > 0.8 ? ' ' : '') + i.t; u.r = Math.max(u.r, i.r); }
        else celdas.push({ t: i.t, x: i.x, r: i.r });
      });
      celdas.forEach((c) => { c.t = c.t.replace(/\s+/g, ' ').trim(); });
      filas.push({ pagina: p + 1, y: g.y, celdas, txt: celdas.map((c) => c.t).join(' ') });
    });
  });
  return filas;
}

function montoCartola(s) {
  s = String(s).replace(/[$\s]/g, '');
  const neg = /^-/.test(s) || /-$/.test(s);
  s = s.replace(/-/g, '');
  if (/,\d{1,2}$/.test(s)) s = s.replace(/\./g, '').replace(',', '.'); else s = s.replace(/[.,]/g, '');
  const n = parseFloat(s);
  return isNaN(n) ? null : (neg ? -n : n);
}
function fechaCartola(dmy) { const m = /(\d{2})\/(\d{2})\/(\d{2,4})/.exec(dmy); if (!m) return ''; const y = m[3].length === 2 ? '20' + m[3] : m[3]; return y + '-' + m[2] + '-' + m[1]; }
function sinTildes(s) { return String(s).normalize('NFD').replace(/[̀-ͯ]/g, ''); }

/** Detecta qué cartola es y la lee. Devuelve { ok, tipo, ...datos, lineas, avisos } */
function leerCartola(filas) {
  const todo = sinTildes(filas.map((f) => f.txt).join('\n')).toUpperCase();
  const pegado = todo.replace(/\s+/g, '');
  if (/ESTADO DE CUENTA\s+LINEA DE CREDITO/.test(todo) || (/MONTO APROBADO/.test(todo) && /MONTO UTILIZADO/.test(todo))) return cartolaLinea(filas, todo);
  if (/CENCOSUD/.test(todo) && /ESTADO DE CUENTA/.test(todo) && /PERIODO FACTURADO/.test(todo)) return cartolaCencosud(filas, todo);
  if (/ESTADODECUENTANACIONALDETARJETA/.test(pegado)) return cartolaTCNacional(filas, todo);
  if (/ESTADODECUENTAINTERNACIONALDETARJETA/.test(pegado)) return cartolaTCInternacional(filas, todo);
  if (/CUENTA CORRIENTE|CUENTA VISTA/.test(todo) && /DETALLE DE TRANSACCION/.test(todo)) return cartolaCuenta(filas, todo);
  return { ok: false, motivo: 'No reconozco este tipo de cartola todavía.' };
}

/* ---------- línea de crédito Banco de Chile: solo informativa ---------- */
function cartolaLinea(filas, todo) {
  const base = cartolaCuenta(filas, todo);
  const aprobado = montoCartola((/MONTO APROBADO\s*:?\s*([\d.]+)/.exec(todo) || [])[1] || '');
  const utilizado = montoCartola((/MONTO UTILIZADO\s*:?\s*([\d.]+)/.exec(todo) || [])[1] || '');
  const intereses = (base.lineas || []).filter((l) => l.sentido === 'cargo' && /INTERES|IMPUESTO|COMISION/.test(sinTildes(l.detalle).toUpperCase()));
  return { ok: false, informativa: true, tipo: 'lc', banco: 'Banco de Chile', ultimos4: base.ultimos4, desde: base.desde, hasta: base.hasta,
    aprobado, utilizado, saldoFinal: base.saldoFinal, lineas: base.lineas || [], intereses };
}

/* ---------- tarjeta Cencosud Scotiabank ---------- */
function cartolaCencosud(filas, todo) {
  const u4 = (/TARJETA\s*\**\s*(\d{4})/.exec(todo) || [])[1] || '';
  const per = /PERIODO FACTURADO\s+(\d{2}\/\d{2}\/\d{4})\s+(\d{2}\/\d{2}\/\d{4})/.exec(todo) || [];
  const pagar = (/PAGAR HASTA\s+(\d{2}\/\d{2}\/\d{4})/.exec(todo) || [])[1] || '';
  const total = (/MONTO TOTAL FACTURADO A PAGAR\s+([\d.]+)/.exec(todo) || [])[1];
  const minimo = (/MONTO MINIMO A PAGAR\s+([\d.]+)/.exec(todo) || [])[1];
  // [lugar] fecha descripción montoOperación totalAPagar n/N valorCuota
  const re = /^(?:(\D*?)\s+)?(\d{2}\/\d{2}\/\d{4})\s+(.+?)\s+(-?[\d.]+(?:,\d+)?)\s+(-?[\d.]+(?:,\d+)?)\s+(\d{1,2})\/(\d{1,2})\s+(-?[\d.]+(?:,\d+)?)$/;
  const lineas = []; const avisos = [];
  let seccion = 0, titular = '', adicional = '';
  filas.forEach((f) => {
    const t = f.txt.replace(/\s+/g, ' ').trim(); const T = sinTildes(t).toUpperCase();
    const sec = /^([1-5])\.\s*(TOTAL OPERACIONES|PRODUCTOS O SERVICIOS|CARGOS, COMISIONES|INFORMACION COMPRAS EN CUOTAS)/.exec(T);
    if (sec) { seccion = Number(sec[1]); return; }
    const tit = /^\*+(\d{4})\s*-\s*(.+)$/.exec(t);
    if (tit) { if (!titular || tit[1] === u4) titular = tit[1]; adicional = tit[1] === u4 ? '' : tit[2].trim(); return; }
    if (!seccion || seccion === 5) return; // la sección 5 solo informa cuotas ya listadas arriba
    const m = re.exec(t);
    if (!m) return;
    const detalle = m[3].trim(); const D = sinTildes(detalle).toUpperCase();
    const monto = montoCartola(m[4]), aPagar = montoCartola(m[5]);
    let clase = 'compra';
    if (/MONTO CANCELADO|^PAGO\b|ABONO/.test(D) && aPagar < 0) clase = 'pago';
    else if (seccion === 4 && aPagar < 0) clase = 'devolucion';
    else if (seccion === 4 || seccion === 3) clase = 'cargo_banco';
    else if (aPagar < 0) clase = 'devolucion';
    const l = { fecha: fechaCartola(m[2]), detalle, montoOperacion: Math.abs(monto), totalAPagar: aPagar, cuota: Number(m[6]), cuotas: Number(m[7]), valorCuota: Math.abs(montoCartola(m[8])), clase };
    if (seccion === 2) l.internacional = true;
    if (adicional) l.adicional = adicional;
    lineas.push(l);
  });
  const suma = lineas.filter((l) => l.clase !== 'pago').reduce((a, l) => a + (l.clase === 'devolucion' ? -1 : 1) * (l.cuotas > 1 ? l.valorCuota : l.montoOperacion), 0);
  const tot = total ? montoCartola(total) : null;
  if (tot != null && Math.round(suma) !== Math.round(tot)) avisos.push('La suma de los movimientos (' + Math.round(suma).toLocaleString('es-CL') + ') no calza con el total facturado: puede faltar alguna línea.');
  return { ok: lineas.length > 0, tipo: 'tc', banco: 'Cencosud', ultimos4: u4, desde: fechaCartola(per[1] || ''), hasta: fechaCartola(per[2] || ''), pagarHasta: fechaCartola(pagar),
    totalFacturado: tot, minimo: minimo ? montoCartola(minimo) : null, cuadra: tot != null ? Math.round(suma) === Math.round(tot) : null, lineas, avisos,
    motivo: lineas.length ? '' : 'Encontré el estado de cuenta Cencosud, pero no pude leer sus movimientos.' };
}

/* ---------- cuenta corriente Banco de Chile ---------- */
function cartolaCuenta(filas, todo) {
  const cuenta = (/N[°º]?\s*DE CUENTA\s*:?\s*X*(\d{4})/.exec(todo) || [])[1] || '';
  const desde = fechaCartola((/DESDE\s*:?\s*(\d{2}\/\d{2}\/\d{4})/.exec(todo) || [])[1] || '');
  const hasta = fechaCartola((/HASTA\s*:?\s*(\d{2}\/\d{2}\/\d{4})/.exec(todo) || [])[1] || '');
  const anioH = Number(hasta.slice(0, 4)), mesH = Number(hasta.slice(5, 7));
  const lineas = []; const avisos = [];
  let col = null, saldoFinal = null, saldoInicial = null;
  filas.forEach((f) => {
    const U = sinTildes(f.txt).toUpperCase();
    const cCargo = f.celdas.find((c) => /MONTO CHEQUES/i.test(sinTildes(c.t)));
    const cAbono = f.celdas.find((c) => /MONTO DEPOSITOS/i.test(sinTildes(c.t)));
    if (cCargo && cAbono) {
      const cSaldo = f.celdas.find((c) => /^SALDO$/i.test(c.t.trim()));

      const cDoc = f.celdas.find((c) => /DOCTO/i.test(c.t));

    if (/^SALDO FINAL/.test(sinTildes(detalle).toUpperCase())) { saldoFinal = saldo; return; }
    if (cargo == null && abono == null) { avisos.push('Sin monto: ' + f.txt); return; }
    lineas.push({ fecha, detalle, monto: Math.abs(cargo != null ? cargo : abono), sentido: cargo != null ? 'cargo' : 'abono', saldo });
  });

  const abonos = lineas.filter((l) => l.sentido === 'abono').reduce((a, l) => a + l.monto, 0);
  const cuadra = saldoInicial != null && saldoFinal != null ? Math.round(saldoInicial - cargos + abonos) === Math.round(saldoFinal) : null;
  return { ok: lineas.length > 0, tipo: 'cc', banco: 'Banco de Chile', ultimos4: cuenta, desde, hasta, saldoInicial, saldoFinal, cargos, abonos, cuadra, lineas, avisos,
    motivo: lineas.length ? '' : 'Encontré la cartola de cuenta corriente, pero no pude leer sus movimientos.' };
}

/* ---------- tarjeta de crédito nacional Banco de Chile ---------- */
/** Una línea de movimiento de tarjeta, leída por partes: fecha, código, descripción, montos, cuota n/N, valor cuota. */
function lineaTC(txt) {
  const t = txt.replace(/\s+/g, ' ').trim();
  const f = /(?:^|\s)(\d{2}\/\d{2}\/\d{2}(?:\d{2})?)\s+(?:(\d{9,})\s*)?(.*)$/.exec(t);
  if (!f) return null;
  const resto = f[3];
  const num = '-?\\s?\\d{1,3}(?:\\.\\d{3})*(?:,\\d{1,2})?-?';
  // cuota "01/01" seguida del valor cuota al final
  const c = new RegExp('(\\d{1,2})\\s?\\/\\s?(\\d{1,2})\\s+\\$?\\s*(' + num + ')\\s*$').exec(resto);
  if (!c) return null;
  let antes = resto.slice(0, c.index).trim();
  const montos = [];
  const fin = new RegExp('\\$?\\s*(' + num + ')\\s*\\$?$');
  for (let k = 0; k < 2; k++) { const m = fin.exec(antes); if (!m || m.index === 0) break; montos.unshift(m[1]); antes = antes.slice(0, m.index).replace(/\s*\$\s*$/, '').trim(); }
  if (montos.length < 1 || !antes) return null;
  return { fecha: f[1], codigo: f[2] || '', detalle: antes, monto: montos[0], total: montos[1] || montos[0], cuota: Number(c[1]), cuotas: Number(c[2]), valor: c[3] };
}
function cartolaTCNacional(filas, todo) {
  const u4 = (/TARJETA DE CREDITO\s+X+[\sX\d]*?(\d{4})\s*(?:\n|FECHA|$)/.exec(todo) || /XXXX\s+\S+\s+\d{4}\s+(\d{4})/.exec(todo) || /TOTAL TARJETA\s+[X\s]+(\d{4})/.exec(todo) || [])[1] || '';
  const per = /PERIODO FACTURADO\s*(\d{2}\/\d{2}\/\d{4})\s*(\d{2}\/\d{2}\/\d{4})/.exec(todo) || [];
  const pagar = (/PAGAR HASTA\s*(\d{2}\/\d{2}\/\d{4})/.exec(todo) || [])[1] || '';
  // el total va con signo $ (en el comprobante, la etiqueta y el monto están en filas distintas, con la fecha entremedio)
  const total = (/MONTO TOTAL FACTURADO A PAGAR[\s\S]{0,160}?\$\s*([\d.]{4,})/.exec(todo) || [])[1];
  const minimo = (/MONTO MINIMO A PAGAR[\s\S]{0,160}?\$\s*([\d.]{2,})/.exec(todo) || [])[1];
  const lineas = []; const avisos = [];
  // si una fila quedó partida (descripción arriba, montos abajo), se juntan
  const fs = filas.map((f) => f.txt);
  for (let i = 0; i < fs.length - 1; i++) {
    if (/\d{2}\/\d{2}\/\d{2}/.test(fs[i]) && !lineaTC(fs[i]) && !/\d{2}\/\d{2}\/\d{2}/.test(fs[i + 1]) && lineaTC(fs[i] + ' ' + fs[i + 1])) { fs[i] = fs[i] + ' ' + fs[i + 1]; fs[i + 1] = ''; }
  }
  fs.forEach((txt) => {
    const l = lineaTC(txt);
    if (!l) return;
    const detalle = l.detalle.replace(/\s*TASA INT\.?\s*[\d,]+\s*%/i, '').replace(/\s+/g, ' ').trim();
    const D = sinTildes(detalle).toUpperCase();
    if (/^TOTAL\b/.test(D)) return;
    const monto = montoCartola(l.monto);
    let clase = 'compra';
    if (/MONTO CANCELADO|PAGO\s+(?:TARJETA|RECIBIDO)|ABONO/.test(D) && monto < 0) clase = 'pago';
    else if (/TRASPASO DEUDA INTERNACIONAL/.test(D)) clase = 'traspaso_int';
    else if (/^(COMISION|INTERESES?|IMPUESTO|CARGO)/.test(D)) clase = 'cargo_banco';
    else if (monto < 0) clase = 'devolucion';
    lineas.push({ fecha: fechaCartola(l.fecha), codigo: l.codigo, detalle, montoOperacion: Math.abs(monto), totalAPagar: montoCartola(l.total), cuota: l.cuota, cuotas: l.cuotas, valorCuota: Math.abs(montoCartola(l.valor)), clase });
  });
  // cuadre: la suma de los cargos del mes (sin el pago) tiene que dar el total facturado
  const suma = lineas.filter((l) => l.clase !== 'pago').reduce((a, l) => a + (l.clase === 'devolucion' ? -1 : 1) * l.valorCuota, 0);
  let tot = total ? montoCartola(total) : null;
  if (tot == null && lineas.length) { tot = suma; avisos.push('No encontré el total facturado; uso la suma de los movimientos.'); }
  const cuadra = tot != null && lineas.length ? Math.round(suma) === Math.round(tot) : null;
  if (cuadra === false) avisos.push('La suma de los movimientos ($' + Math.round(suma).toLocaleString('es-CL') + ') no calza con el total facturado: puede faltar alguna línea.');
  return { ok: lineas.length > 0, tipo: 'tc', banco: 'Banco de Chile', ultimos4: u4, desde: fechaCartola(per[1] || ''), hasta: fechaCartola(per[2] || ''), pagarHasta: fechaCartola(pagar),
    totalFacturado: tot, minimo: minimo ? montoCartola(minimo) : null, cuadra, lineas, avisos,
    motivo: lineas.length ? '' : 'Encontré el estado de cuenta de la tarjeta, pero no pude leer sus movimientos.' };
}

/* ---------- tarjeta de crédito internacional (dólares) ---------- */
function cartolaTCInternacional(filas, todo) {
  const u4 = (/XXXX\s+\S+\s+\d{4}\s+(\d{4})/.exec(todo) || [])[1] || '';
  const desde = fechaCartola((/PERIODO FACTURADO DESDE\s*(\d{2}\/\d{2}\/\d{4})/.exec(todo) || [])[1] || '');
  const hasta = fechaCartola((/PERIODO FACTURADO HASTA\s*(\d{2}\/\d{2}\/\d{4})/.exec(todo) || [])[1] || '');
  const pagar = fechaCartola((/PAGAR HASTA\s*(\d{2}\/\d{2}\/\d{4})/.exec(todo) || [])[1] || '');

  const re = /(\d{2}\/\d{2}\/\d{2})\s+(.+?)\s+(-?[\d.]+,\d{2})\s+(-?[\d.]+,\d{2})\s*$/;
  const lineas = [];
  filas.forEach((f) => {
    const m = re.exec(f.txt.replace(/\s+/g, ' '));

    motivo: lineas.length ? '' : 'Encontré el estado de cuenta en dólares, pero no pude leer sus movimientos.' };
}

function cargarPdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  const base = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  const script = (src) => new Promise((ok, mal) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => mal(new Error('No pude cargar el lector de PDF. Revisa tu conexión e inténtalo de nuevo.')); document.head.appendChild(s); });
  return script(base + 'pdf.min.js').then(() => script(base + 'pdf.worker.min.js').catch(() => null)).then(() => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.js'; return window.pdfjsLib; });
}

const listaClaves = (c) => (Array.isArray(c) ? c : c ? [c] : []);
/** Prueba sin clave, luego las claves guardadas (una por banco) y solo si ninguna abre el PDF te la pide. */
async function leerPdf(buffer) {
  const lib = await cargarPdfJs();
  const probar = [''].concat(S.claves || [], S.clavesSesion || []);
  let clave = probar.shift(), recordar = false, pedida = false, intento = 0;
  for (;;) {
    try {
      const doc = await lib.getDocument({ data: new Uint8Array(buffer.slice(0)), password: clave || undefined, isEvalSupported: false }).promise;
      if (pedida && clave) {
        if (recordar) { S.claves = [clave].concat((S.claves || []).filter((x) => x !== clave)); api('api_guardarClaveCartolas', clave, true).catch(() => {}); }
        else S.clavesSesion = [clave].concat((S.clavesSesion || []).filter((x) => x !== clave));
      }
      const paginas = [];
      for (let i = 1; i <= doc.numPages; i++) {
        const pg = await doc.getPage(i); const tc = await pg.getTextContent();
        paginas.push(tc.items.map((it) => ({ str: it.str, x: it.transform[4], y: it.transform[5], w: it.width, h: it.height })));
      }
      return paginas;
    } catch (e) {
      if (e && e.name === 'PasswordException') {

/** Una misma cartola puede traer varias partes (ej. tarjeta en pesos + en dólares): se separan por página. */
function leerDocumento(paginas) {
  const grupos = [];
  paginas.forEach((items) => {
    const f = filasPdf([items]);
    const U = sinTildes(f.map((x) => x.txt).join(' ')).toUpperCase();
    const tipo = /TARJETA CENCOSUD/.test(U) ? 'tcc' : /ESTADO DE CUENTA\s+LINEA DE CREDITO/.test(U) || (/MONTO APROBADO/.test(U) && /MONTO UTILIZADO/.test(U)) ? 'lc' : /ESTADO DE CUENTA NACIONAL DE TARJETA/.test(U) ? 'tc' : /ESTADO DE CUENTA INTERNACIONAL DE TARJETA/.test(U) ? 'tci' : /DETALLE DE TRANSACCION/.test(U) && /CUENTA (CORRIENTE|VISTA)/.test(U) ? 'cc' : '';
    const ult = grupos[grupos.length - 1];
    if (!ult || (tipo && tipo !== ult.tipo)) grupos.push({ tipo, paginas: [items] }); else ult.paginas.push(items);
